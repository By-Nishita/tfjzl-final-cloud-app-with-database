<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Details</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<div class="container mt-5">

    <div class="card">
        <div class="card-body">

            <h1 class="card-title">
                {{ course.name }}
            </h1>

            <p class="card-text">
                {{ course.description }}
            </p>

        </div>
    </div>

    <h2 class="mt-5 mb-3">
        Lessons
    </h2>

    {% for lesson in lessons %}

        <div class="card mb-3">

            <div class="card-body">

                <h4 class="card-title">
                    {{ lesson.title }}
                </h4>

                <p class="card-text">
                    {{ lesson.content }}
                </p>

                <a
                    href="{% url 'exam' lesson.id %}"
                    class="btn btn-primary"
                >
                    Take Exam
                </a>

            </div>

        </div>

    {% empty %}

        <div class="alert alert-warning">
            No lessons available.
        </div>

    {% endfor %}

</div>

</body>
</html>
